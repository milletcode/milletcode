[package]
name = "agent-console"
version.workspace = true
edition.workspace = true
# 多 bin 下 `cargo run`（make dev/backend）默认跑服务端
default-run = "agent-console"

[[bin]]
name = "agent-console"
path = "src/main.rs"

[[bin]]
name = "millet-tunnel"
path = "src/bin/millet-tunnel.rs"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# /p/ reverse proxy upstream client (http1 one-shot, no pool)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Embedded static files
rust-embed = "8"
mime_guess = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Pattern matching
regex = "1"

# Config
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Sockets — strict bind (SO_REUSEADDR off) for port-forward occupancy checks
socket2 = "0.5"

# Concurrency
parking_lot = "0.12"
dashmap = "6"
num_cpus = "1"

# Embedded KV store (session persistence)
redb = "2"

# HTTP client (DeepSeek adapter)
reqwest = { version = "0.12", features = ["stream", "json"] }

# PTY (Phase 2)
portable-pty = "0.8"

# Process management
nix = { version = "0.29", features = ["signal"] }

# URL encoding (composite keys contain /)
urlencoding = "2"

# millet-tunnel CLI WebSocket client (server side uses axum ws)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# SSH remote execution
russh = "0.48"
russh-keys = "0.48"
russh-sftp = "2"
shellexpand = "3"

# OAuth / Auth
oauth2 = { version = "5", features = ["reqwest"] }
cookie = { version = "0.18", features = ["secure", "private"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
sevenz-rust = { version = "0.6.1", features = ["aes256"] }
