name: CI

on:
  push:
    # feat/** 分支 push 自跑测试（不打包）；打包由 build job 的 if 门控到 main/staging
    branches: [main, staging, "feat/**"]
  pull_request:
    branches: [main, staging]
  # 手动触发：任意分支点按钮跑测试，不必动主干分支
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 读取本 workflow 自身的 job 日志，用于失败时把错误回显成注解
  actions: read

env:
  IMAGE: milletcode/milletcode

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # 钉 1.95：与 Dockerfile（rust:1.95-alpine）及本地开发工具链一致
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      # rust-embed 在编译期要求 ../frontend-svelte/dist 存在（static_files.rs），
      # 单测不读其内容，预建空目录即可；本地因 dist 常在从未暴露
      - name: Prepare empty frontend dist
        run: mkdir -p frontend-svelte/dist
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast
      # 失败时拉取本 job 自己的日志，把 error / 失败测试名回显为注解
      # （注解可匿名从 API 读取，无需到网页翻日志）
      - name: Surface failures as annotations
        if: failure()
        run: |
          set -eu
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions"
          # GITHUB_TOKEN 不是环境变量，要用表达式显式取（permissions 块已声明 actions: read）
          auth="Authorization: Bearer ${{ github.token }}"
          job_id=$(curl -sf -H "$auth" "$api/runs/${GITHUB_RUN_ID}/jobs" \
            | python3 -c 'import json,sys; print([j["id"] for j in json.load(sys.stdin)["jobs"] if j["name"].startswith("test-backend")][0])')
          # 日志端点 302 到带签名的 blob URL，带 Authorization 头跟随重定向会被拒：
          # 先取 redirect_url，再裸请求
          log_url=$(curl -sf -H "$auth" -o /dev/null -w '%{redirect_url}' "$api/jobs/${job_id}/logs")
          if [ -n "$log_url" ]; then
            curl -sfL "$log_url" -o /tmp/job.log
          else
            curl -sf -H "$auth" "$api/jobs/${job_id}/logs" -o /tmp/job.log
          fi
          # 下载的原始日志每行带 ISO 时间戳前缀，先剥掉再匹配行首
          sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z[[:space:]]*//' /tmp/job.log > /tmp/job.clean.log || true
          grep -E '^(error|failures:|---- |test result: FAILED|thread .* panicked)' -A 2 /tmp/job.clean.log \
            | head -24 | sed 's/::/ | /g' \
            | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::${line}"
              done || true

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-svelte
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # build 内含 svelte-check + vite build
      - run: npm run build

  # 打包门控：push 到 main / staging 才构建。双架构原生 runner 各自构建推送，
  # 再由 merge 合并 manifest。镜像 tag：main → latest + main-<sha8>；staging → staging。
  # ubuntu-24.04-arm 仅公开仓库免费；仓库转私有时此 job 会无 runner 可用。
  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: [test-backend, test-frontend]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 分支感知的临时 per-arch tag 与版本号：main-<sha8>-<arch> / staging-<sha8>-<arch>
      - name: Compute branch tags
        run: |
          SHA8=${GITHUB_SHA::8}
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "SHA8=$SHA8" >> "$GITHUB_ENV"
          echo "PER_ARCH_TAG=${IMAGE}:${BRANCH}-${SHA8}-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "GIT_VERSION=${BRANCH}-${SHA8}" >> "$GITHUB_ENV"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          load: true
          tags: ${{ env.PER_ARCH_TAG }}
          build-args: |
            GIT_VERSION=${{ env.GIT_VERSION }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ env.BRANCH }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
      - name: Extract release binary
        run: |
          id=$(docker create "${PER_ARCH_TAG}")
          docker cp "$id":/app/milletcode "./milletcode-linux-${{ matrix.arch }}"
          docker rm "$id"
          chmod +x "milletcode-linux-${{ matrix.arch }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: milletcode-linux-${{ matrix.arch }}
          path: milletcode-linux-${{ matrix.arch }}
          if-no-files-found: error

  # 合并双架构 manifest：main → main-<sha8>（可追溯）+ latest；staging → staging
  merge:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Merge multi-arch manifest
        run: |
          SHA8=${GITHUB_SHA::8}
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker buildx imagetools create \
              -t "${IMAGE}:main-${SHA8}" \
              -t "${IMAGE}:latest" \
              "${IMAGE}:main-${SHA8}-amd64" \
              "${IMAGE}:main-${SHA8}-arm64"
          else
            docker buildx imagetools create \
              -t "${IMAGE}:staging" \
              "${IMAGE}:staging-${SHA8}-amd64" \
              "${IMAGE}:staging-${SHA8}-arm64"
          fi
